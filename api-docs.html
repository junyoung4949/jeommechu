<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="/favicon_eng.svg" />
  <title>점메추 API 문서</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui.css" />
  <style>
    body { margin: 0; background: #fafafa; }
    .topbar { display: none; }
    .banner {
      background: #1b1b1f; color: #e8e8ea; padding: 14px 20px;
      font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    }
    .banner b { color: #fff; }
    .banner code {
      background: #ffffff1a; padding: 1px 6px; border-radius: 4px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px;
    }
    .banner .warn { color: #ffcc66; }
  </style>
</head>
<body>
  <div class="banner">
    <b>점메추 API</b> — 이 페이지는 Vite dev 서버가 서빙하므로 <code>/api</code> 서버를 고르면
    <b>Try it out</b> 이 동일 출처로 나가서 HttpOnly 쿠키가 그대로 동작합니다.
    <span class="warn">실제 데이터가 생성·변경되니 주의하세요.</span>
  </div>
  <div id="swagger-ui"></div>

  <script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-bundle.js" crossorigin></script>
  <script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-standalone-preset.js" crossorigin></script>
  <script>
    window.onload = () => {
      window.ui = SwaggerUIBundle({
        url: './openapi.yaml',
        dom_id: '#swagger-ui',
        presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
        layout: 'BaseLayout',
        deepLinking: true,
        // 쿠키 인증을 쓰므로 자격 증명을 함께 보낸다.
        withCredentials: true,
        docExpansion: 'list',
        defaultModelsExpandDepth: 1,
        tryItOutEnabled: true,
        persistAuthorization: true,
      });
    };
  </script>
</body>
</html>
