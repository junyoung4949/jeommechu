<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon_eng.svg" />
    <title>점메추 — 오늘 점심, 뭐 먹을까?</title>
    <meta name="description" content="인원수·예산·카테고리를 고르면 딱 맞는 점심 메뉴를 추천해드려요." />

    <!--
      홈과 SPA 경로(/menus/17 등)가 공유될 때 쓰이는 미리보기다.
      메뉴별 카드는 /share/{id} 가 따로 만든다 (infra/share/ 참고) — 여기는 그 외 전부의 기본값이다.

      크롤러는 JS 를 실행하지 않으므로 이 값들은 정적이어야 한다.
      og:image 는 반드시 절대 URL 이다. 상대 경로(/og.jpg)를 쓰면 크롤러가 해석하지
      못해 이미지 없는 카드가 나간다. 도메인은 정식 주소인 apex 로 박는다.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="점메추" />
    <meta property="og:title" content="점메추 — 오늘 점심, 뭐 먹을까?" />
    <meta property="og:description" content="인원수·예산·카테고리를 고르면 딱 맞는 점심 메뉴를 추천해드려요." />
    <!-- ?v 는 캐시 무력화용이다. 카카오·슬랙은 URL 단위로 스크랩 결과를 캐시하므로,
         이미지를 바꿀 때 이 숫자를 올리지 않으면 한동안 옛 이미지가 계속 나간다. -->
    <meta property="og:image" content="https://jeommechu.co.kr/og.jpg?v=1" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="상 위에 차려진 김치찌개, 김밥, 짜장면, 삼겹살" />
    <meta property="og:url" content="https://jeommechu.co.kr/" />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="점메추 — 오늘 점심, 뭐 먹을까?" />
    <meta name="twitter:description" content="인원수·예산·카테고리를 고르면 딱 맞는 점심 메뉴를 추천해드려요." />
    <meta name="twitter:image" content="https://jeommechu.co.kr/og.jpg?v=1" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
